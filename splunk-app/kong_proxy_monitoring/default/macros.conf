#
# Kong Proxy Monitoring - search macros
#
# ---------------------------------------------------------------------------
# EVERY dashboard panel and EVERY alert in this app is built on `kong_base`.
# Install this file first and verify it before anything else.
#
# `kong_base` exists to solve four Kong-specific data traps exactly once, so
# that no panel and no alert has to re-solve them (and get them wrong):
#
#   1. latencies.proxy = -1 is a SENTINEL, not a measurement. It means the
#      request never reached the upstream because Kong short-circuited it
#      (auth reject, rate limit, no healthy target). Averaging or
#      percentiling the raw column drags latency stats toward negative and
#      understates real upstream latency. kong_base nulls it and exposes the
#      condition separately as short_circuited.
#
#   2. upstream_status arrives in FOUR shapes: a plain code (200), a
#      comma-joined retry list ("502, 200"), a literal dash (-) when nginx
#      reached no upstream, or null/absent when Kong short-circuited before
#      the balancer ran. kong_base collapses all of them to either a valid
#      3-digit code or null, so downstream logic needs only isnull().
#
#   3. started_at is epoch MILLISECONDS while route.created_at and
#      service.created_at are epoch SECONDS -- in the same event.
#
#   4. Dotted field names ('response.status') require single quotes in eval.
#      kong_base renames them to bare names once.
#
# Kong version: 3.4. See ../../../docs/log-format-validation.md for the
# field-by-field validation against the 3.4 serializer source, and for what
# changes on upgrade to 3.5+.
#
# ---------------------------------------------------------------------------
# EDITING THIS FILE: put your changes in local/, not here.
#
# Splunk reads default/ then overlays local/. Anything you edit in default/ is
# overwritten the next time this app is redeployed. To change the index, or to
# tune a threshold, copy just the stanza you are changing into
# local/macros.conf and edit it there:
#
#     mkdir -p $SPLUNK_HOME/etc/apps/kong_proxy_monitoring/local
#     # add only the [kong_index] stanza to local/macros.conf, edited
#
# The same applies to savedsearches.conf. Edits made through the Splunk UI
# land in local/ automatically - it is only hand-editing that gets this wrong.
# ---------------------------------------------------------------------------


# --- Data location -----------------------------------------------------------
# Single source of truth. If your index or source path differs, change it HERE
# and every dashboard and alert follows automatically.
[kong_index]
definition = index=kong_common source="/openshift/logs.stdout"
iseval = 0


# --- The foundation ----------------------------------------------------------
# latencies.request=* is the discriminator for "this is a Kong log-serializer
# event". It is present on every serializer event and on no other line in the
# same stdout stream (nginx access logs, Kong startup output, error logs).
#
# Do NOT filter on route.name=* instead. Requests that match no route have a
# null route -- those are Kong-generated 404s, and they are exactly the events
# you need when someone reports "my endpoint disappeared".
[kong_base]
definition = `kong_index` latencies.request=* \
| eval route           = coalesce('route.name', "(no-route-matched)"), \
       service         = coalesce('service.name', "(no-service)"), \
       upstream_host   = coalesce('service.host', "(none)"), \
       status          = tonumber('response.status'), \
       kong_ms         = tonumber('latencies.kong'), \
       total_ms        = tonumber('latencies.request'), \
       short_circuited = if(tonumber('latencies.proxy') < 0, 1, 0), \
       proxy_ms        = if(tonumber('latencies.proxy') < 0, null(), tonumber('latencies.proxy')), \
       resp_bytes      = tonumber('response.size'), \
       upstream_path   = 'upstream_uri', \
       vault_ns        = 'response.headers.x-vault-namespace', \
       try_count       = coalesce(mvcount('tries{}.ip'), 0), \
       upstream_ip     = mvindex('tries{}.ip', -1), \
       balancer_ms     = tonumber(mvindex('tries{}.balancer_latency', -1)) \
| eval read_timeout_ms    = tonumber('service.read_timeout'), \
       connect_timeout_ms = tonumber('service.connect_timeout'), \
       write_timeout_ms   = tonumber('service.write_timeout'), \
       max_retries        = tonumber('service.retries') \
| eval status_class    = case(isnull(status), "unknown", status < 200, "1xx", status < 300, "2xx", \
                              status < 400, "3xx", status < 500, "4xx", true(), "5xx") \
| eval retried         = if(try_count > 1, 1, 0) \
| eval retries_exhausted = if(isnotnull(max_retries) AND try_count > max_retries, 1, 0) \
| eval us_codes        = split(replace(coalesce('upstream_status', ""), " ", ""), ",") \
| eval us_codes        = mvfilter(match(us_codes, "^[0-9]{3}$")) \
| eval upstream_status = mvindex(us_codes, -1) \
| eval error_source    = case(isnull(status),                     "unknown", \
                              status < 400,                       "ok", \
                              short_circuited == 1,               "kong", \
                              isnull(upstream_status),            "kong", \
                              tonumber(upstream_status) >= 400,   "upstream", \
                              true(),                             "kong") \
| fields - us_codes
iseval = 0


# --- Latency-safe base -------------------------------------------------------
# Use this, never `kong_base`, for any avg/percentile over proxy_ms.
# Short-circuited requests never reached the upstream, so including them in an
# upstream-latency statistic is measuring something that did not happen.
[kong_proxied]
definition = `kong_base` | where short_circuited == 0
iseval = 0


# --- Role bindings -----------------------------------------------------------
# THESE THREE MACROS ARE THE PORTABILITY SURFACE OF THIS APP.
#
# Some dashboards and alerts are about a specific ROLE rather than about
# traffic in general: the service fronting Kong's Admin API is privileged, the
# Vault auth route has its own failure semantics, and the rate-limiting plugin
# is attached to one route. Those names used to be hardcoded in fourteen
# places across the dashboards and alerts, which meant a deployment using
# different names got a blank Security dashboard and two alerts that silently
# never fired.
#
# Now they live here. Deploying against a different Kong install? Edit these
# three, plus the two dashboard input defaults listed in
# ../../../docs/operations-guide.md section 5. That is the whole job.
#
# A Simple XML <default> cannot reference a macro, which is why the dashboard
# defaults cannot also live here. Five places, not one -- but down from
# fourteen, and all five are in one table in the guide.
#
# If a role does not exist in your deployment, point the macro at something
# that matches nothing (e.g. service="__none__"). Panels then render empty
# rather than wrong, and the alert never fires. That is intended degradation.

# The service fronting Kong's Admin API. Used by the Security and Tenancy
# dashboard and by the "Admin API Unexpected Activity" alert.
[kong_admin_service]
definition = search service="admin-api"
iseval = 0

# The route handling Vault authentication. Used by the Security and Tenancy
# dashboard and by the "Authentication Failure Spike" alert.
[kong_auth_route]
definition = search route="auth-route"
iseval = 0

# The route carrying the rate-limiting plugin. Used by the Traffic dashboard.
[kong_ratelimited_route]
definition = search route="ee-smp-functests"
iseval = 0


# --- Shared constants --------------------------------------------------------
# Rule applied here: a constant earns a macro when it is used in more than one
# place. Everything else is written inline in the alert that uses it, where you
# can read it in context instead of looking it up. Section 7 of the operations
# guide lists every threshold and where to edit it - that table is the tuning
# surface, not this file alone.
#
# NOTE: there is deliberately no kong_read_timeout_ms macro any more. The
# upstream timeout is not a constant to be configured - it is IN EVERY LOG
# EVENT as service.read_timeout, and kong_base now reads it as
# read_timeout_ms. Hardcoding it to 60000 was wrong across services: one
# configured with a 10s timeout would have had to reach 48s before the
# timeout-proximity alert considered it slow, long after it had already
# timed out. Same reasoning for service.retries -> max_retries.

# Minimum request count before a ratio-based alert may fire. Used by four
# alerts. Without this guard, one failed request during a quiet window is a
# 100% error rate and pages someone at 3am.
[kong_min_requests]
definition = 50
iseval = 0

#
# Kong Proxy Monitoring - KV Store collection
#
# ---------------------------------------------------------------------------
# WHY A KV STORE COLLECTION AND NOT A CSV LOOKUP
#
# This app is deployed to Splunk Cloud, which makes the storage choice a
# security decision rather than only an operational one:
#
#   - A CSV lookup is bundled into the search bundle and replicated out to the
#     INDEXER TIER on every search. A KV Store collection stays on the search
#     head tier and is access-controlled per collection. For mutable state on
#     SaaS, that difference is the whole argument.
#
#   - KV Store handles its own replication across search head cluster members.
#     outputlookup against a CSV in an SHC relies on lookup replication and is
#     a known source of write conflicts and stale reads.
#
#   - KV Store is the mechanism Splunk added for frequently-updated state. CSV
#     lookups are documented as suited to small, infrequently-changing data.
#
# WHAT CAN AND CANNOT LAND IN HERE
#
# The refresh search ("Kong - Refresh Topology" in savedsearches.conf) is an
# aggregation: `| stats count by service, route`. Only those two dimensions
# plus a count and a timestamp can structurally reach this collection. Client
# IPs, Vault namespaces, request paths, response headers and token index
# values CANNOT, regardless of what appears in the logs.
#
# That guarantee comes from the shape of the search, not from a filter someone
# has to remember to add. If you change the refresh search, you are changing a
# security control -- re-run the invariant check in operations-guide.md.
#
# Size is bounded: entries unseen for 30 days age out, so the realistic
# ceiling is (services x routes), which is tens of rows.
# ---------------------------------------------------------------------------

[kong_topology]
enforceTypes = true
field.service   = string
field.route     = string
field.requests  = number
field.last_seen = number

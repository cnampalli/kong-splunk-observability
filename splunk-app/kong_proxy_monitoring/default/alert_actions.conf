#
# Kong Proxy Monitoring - alert action presentation defaults
#
# ---------------------------------------------------------------------------
# Deliberately minimal.
#
# This file sets only how alert emails are FORMATTED. It does NOT set
# recipients, and it does NOT configure the mail server.
#
#   - Recipients are set per-alert via action.email.to in savedsearches.conf,
#     so that a latency warning and an Admin API security alert can go to
#     different people.
#
#   - The mail server (Settings > Server settings > Email settings) is an
#     instance-level setting. This app cannot and should not configure it.
#     If it is not configured, every alert will trigger and then silently
#     fail to deliver. Verify it first -- see operations-guide.md section 6.
#
# Note on naming: Splunk has no "alerts.conf". Alerts are saved searches
# carrying alert.* properties in savedsearches.conf. This file configures the
# delivery mechanisms those searches invoke.
# ---------------------------------------------------------------------------

[email]
# Include the triggering rows in the email body so the on-call engineer can
# triage without logging in.
inline = 1
format = table
sendresults = 1
# Link back to the search so they can pivot immediately.
include.view_link = 1
include.results_link = 1
include.search = 1
include.trigger = 1
include.trigger_time = 1
# Keep attachments off. These alerts return small aggregate tables, and CSV
# attachments frequently trip mail-gateway scanning.
sendcsv = 0
sendpdf = 0

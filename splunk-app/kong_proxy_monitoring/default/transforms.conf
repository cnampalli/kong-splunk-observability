#
# Kong Proxy Monitoring - lookup definition
#
# Exposes the kong_topology KV Store collection (collections.conf) to SPL as
# `| inputlookup kong_topology` and `| outputlookup kong_topology`.
#
# The dashboards use inputlookup to populate their Service and Route
# dropdowns. That is a collection read on the search head, NOT an index scan
# -- which is the point. Populating a dropdown with a live `kong_base` search
# costs a full scan over the selected time range on every single page load,
# and it also hides any route that happened to be silent during that window.
#
# Only the "Kong - Refresh Topology" scheduled search writes to it. Write
# permission is restricted in metadata/default.meta.
#

[kong_topology]
external_type = kvstore
collection    = kong_topology
fields_list   = _key, service, route, requests, last_seen

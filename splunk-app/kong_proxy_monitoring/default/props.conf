#
# Kong Proxy Monitoring - field extraction
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE INSTALLING
# ---------------------------------------------------------------------------
# Your data is ALREADY being indexed at:
#     index=kong_common source="/openshift/logs.stdout"
#
# If a sourcetype is already assigned to that data and JSON fields already
# resolve in search (test with the query in operations-guide.md section 3),
# you do NOT need this file at all. Skip it.
#
# Use this file only if dotted fields such as latencies.request do not
# resolve. Rename the stanza below to match your actual sourcetype.
#
# WHY KV_MODE AND NOT INDEXED_EXTRACTIONS:
#   KV_MODE = json is a SEARCH-TIME setting. It works immediately on data
#   that is already indexed, and requires no re-indexing.
#
#   INDEXED_EXTRACTIONS = json is an INDEX-TIME setting. It only affects data
#   ingested AFTER the change, must be deployed to the forwarder or heavy
#   forwarder (not the search head), and will not fix historical events.
#   Use it only if you are also changing the ingestion pipeline.
#
#   Do not enable both. Doing so double-extracts every field.
# ---------------------------------------------------------------------------

[kong:proxy:json]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
category = Web
description = Kong Gateway 3.4 proxy access log (JSON log serializer)

# Kong emits started_at as epoch MILLISECONDS (13 digits) via
# kong.request.get_start_time(). %s%3N parses that correctly.
#
# Do NOT point the timestamp at route.created_at or service.created_at --
# those are epoch SECONDS (10 digits) describing when the Kong config entity
# was created, not when the request happened. Mixing them up backdates every
# event to the config's creation date.
TIME_PREFIX = \"started_at\"\s*:\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 20

# No FIELDALIAS entries here on purpose. Renaming the dotted fields to friendly
# names is exactly what the `kong_base` macro does, and it does it better --
# aliases can only rename, whereas the macro also normalises the -1 latency
# sentinel and the four shapes of upstream_status. A second, dumber renaming
# layer would just be another thing to keep in sync.
#
# For ad-hoc searching, start from `kong_base` rather than the raw fields.

#
# Kong Proxy Monitoring - alerts
#
# ===========================================================================
# EVERY ALERT IN THIS FILE SHIPS DISABLED (disabled = 1). THIS IS DELIBERATE.
#
# The thresholds are placeholders chosen from the Kong config (read_timeout
# 60000 ms, retries 5) and from general gateway norms. They have NOT been
# fitted to your traffic, because that requires a baseline week of real data.
# Enabling all twelve against untuned thresholds is how a monitoring rollout
# gets muted in its first fortnight.
#
# Do this instead:
#   1. Run the baseline queries in ../../../docs/operations-guide.md section 7.
#   2. Edit each threshold from what you observe. Section 7 of that guide has
#      a table listing every threshold and which alert to edit. Two shared
#      One shared constant (kong_min_requests) lives in macros.conf because
#      four searches use it; the rest are inline in the WHERE clause of the
#      alert below, so you can read them in context.
#      The upstream read timeout and the retry budget are NOT tunable here -
#      they are read per-service from service.read_timeout and
#      service.retries in the log itself.
#   3. Enable in the order recommended below.
#   4. Watch for a week. Re-tune anything that fired more than twice without
#      a human deciding it mattered.
#
# RECOMMENDED ENABLE ORDER
#   First  - these are threshold-light and safe to turn on immediately:
#              Kong - Log Ingestion Stalled
#              Kong - Upstream Unreachable
#              Kong - Admin API Unexpected Activity
#   Second - after one day of baseline:
#              Kong - Service 5xx Rate Breach
#              Kong - Route Traffic Stopped
#              Kong - Authentication Failure Spike
#   Third  - after a full baseline week, once percentiles are known:
#              everything else.
#
# BEFORE ENABLING ANYTHING: set action.email.to on each alert, and confirm
# the mail server is configured under Settings > Server settings > Email
# settings. An alert with no mail server triggers and then silently fails to
# deliver, which is worse than no alert at all.
#
# Replace CHANGEME@example.com throughout.
#
# ---------------------------------------------------------------------------
# A note on throttling. Every alert uses time-based suppression
# (alert.suppress + alert.suppress.period) which is GLOBAL to the search: once
# it fires for vault-svc, a breach on admin-api inside the same window is also
# suppressed. That is the safe default. If you need per-service granularity,
# set alert.digest_mode = 0 and alert.suppress.fields = service on that alert,
# accepting one email per breaching row. See alert-runbook.md.
#
# A note on naming. Splunk has no "alerts.conf". An alert IS a saved search
# carrying alert.* properties, which is why they all live here.
# ===========================================================================


# ---------------------------------------------------------------------------
# 1. Service 5xx rate breach
#    Splits Kong-generated from upstream-generated so the email says which
#    team owns the problem.
# ---------------------------------------------------------------------------
[Kong - Service 5xx Rate Breach]
search = `kong_base` \
| stats count as requests, \
        sum(eval(if(status>=500,1,0))) as errors, \
        sum(eval(if(error_source=="kong"     AND status>=500,1,0))) as caused_by_kong, \
        sum(eval(if(error_source=="upstream" AND status>=500,1,0))) as caused_by_upstream, \
        values(route) as routes \
        by service \
| where requests >= `kong_min_requests` \
| eval error_pct = round(errors*100/requests, 2) \
| where error_pct > 2 \
| sort - error_pct
description = 5xx rate for a service exceeded the threshold over the last 5 minutes. caused_by_kong vs caused_by_upstream tells you whether the gateway or the backend is at fault. Guarded by kong_min_requests so a quiet window cannot page on a single failure.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][HIGH] 5xx rate breach - $job.resultCount$ service(s)
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 2. Upstream unreachable
#    short_circuited=1 with a 5xx means Kong could not reach the backend at
#    all - not that the backend returned an error. Different failure, different
#    fix (pod down, DNS, network policy) so it gets its own alert.
# ---------------------------------------------------------------------------
[Kong - Upstream Unreachable]
search = `kong_base` \
| where short_circuited==1 AND status>=500 \
| stats count as failures, \
        values(status) as status_codes, \
        dc(client_ip) as affected_clients, \
        values(upstream_host) as upstream_host \
        by service, route \
| where failures >= 10 \
| sort - failures
description = Kong returned 5xx without ever reaching the upstream (latencies.proxy = -1). Indicates no healthy target, DNS failure, or a network path problem - not an application error. Check pod readiness and Kong upstream health first.
cron_schedule = 1-59/5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 15m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][CRITICAL] Upstream unreachable - Kong cannot reach the backend
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 3. Route traffic stopped
#    Catches the silent failures nothing else catches: a route deleted from
#    Kong config, a client that died, a DNS change upstream of the gateway.
#    No errors are generated in any of those cases - traffic simply ceases.
#
#    The subsearch supplies the baseline AND the route name, which is what
#    makes a zero-traffic route detectable at all. A route with no events in
#    the current window produces no row in the outer search, so without the
#    subsearch there would be nothing to compare against.
# ---------------------------------------------------------------------------
[Kong - Route Traffic Stopped]
search = `kong_base` \
| stats count as current by route \
| append [ search `kong_base` earliest=-25h@h latest=-1h@h \
           | bin _time span=15m \
           | stats count as c by _time, route \
           | stats avg(c) as baseline_per_15m by route ] \
| stats sum(current) as current, sum(baseline_per_15m) as baseline_per_15m by route \
| fillnull value=0 current \
| eval baseline_per_15m = round(baseline_per_15m, 1) \
| where baseline_per_15m >= 20 AND current == 0 \
| sort - baseline_per_15m
description = A route that normally carries traffic has received zero requests in the last 15 minutes. Baseline is the mean per 15-minute bucket over the preceding 24 hours, excluding the last hour. Only routes averaging 20+ requests per bucket are considered, so genuinely low-volume routes do not alert.
cron_schedule = 2-59/5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 60m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][HIGH] Route traffic stopped - $job.resultCount$ route(s) silent
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 4. Upstream latency p95 breach
#    Uses `kong_proxied`, never `kong_base` - short-circuited requests never
#    reached the upstream and must not contribute to an upstream statistic.
# ---------------------------------------------------------------------------
[Kong - Upstream Latency p95 Breach]
search = `kong_proxied` \
| stats count as requests, \
        p50(proxy_ms) as p50_ms, \
        p95(proxy_ms) as p95_ms, \
        p99(proxy_ms) as p99_ms, \
        max(proxy_ms) as max_ms \
        by service \
| where requests >= `kong_min_requests` \
| eval p50_ms=round(p50_ms,0), p95_ms=round(p95_ms,0), p99_ms=round(p99_ms,0), max_ms=round(max_ms,0) \
| where p95_ms > 2000 \
| sort - p95_ms
description = Upstream response time p95 exceeded the threshold over the last 10 minutes. Measures upstream wait only (latencies.proxy), excluding requests Kong short-circuited. If Kong overhead is also elevated, check the Gateway Self-Latency alert instead - the cause may be inside Kong.
cron_schedule = 3-59/5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][MEDIUM] Upstream latency p95 breach
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 5. Gateway self-latency breach
#    Kong's own overhead, not the upstream's. A rise here means a plugin, the
#    datastore behind the rate limiter, or DNS - and it is invisible to any
#    upstream-focused alert.
#
#    On Kong 3.4 latencies.kong INCLUDES request receive time, so a large slow
#    request body inflates this. Re-tune after upgrading to 3.5+, where
#    receive time becomes a separate field.
# ---------------------------------------------------------------------------
[Kong - Gateway Self-Latency Breach]
search = `kong_proxied` \
| stats count as requests, \
        p50(kong_ms) as p50_kong_ms, \
        p95(kong_ms) as p95_kong_ms, \
        max(kong_ms) as max_kong_ms, \
        p95(proxy_ms) as p95_upstream_ms \
        by service, route \
| where requests >= `kong_min_requests` \
| eval p50_kong_ms=round(p50_kong_ms,1), p95_kong_ms=round(p95_kong_ms,1), \
       max_kong_ms=round(max_kong_ms,1), p95_upstream_ms=round(p95_upstream_ms,0) \
| where p95_kong_ms > 100 \
| sort - p95_kong_ms
description = Kong's own processing time p95 exceeded the threshold. This is gateway overhead - plugin execution, routing, and on 3.4 also request receive time - not upstream wait. p95_upstream_ms is included for contrast: if it is normal while Kong overhead is high, the problem is inside the gateway.
cron_schedule = 4-59/5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][HIGH] Gateway self-latency breach - problem is inside Kong
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 6. Balancer retry storm
#    Retries are Kong masking a sick backend. Users still see success, so this
#    never shows up in the error rate - until the retries run out. The service
#    is configured with retries = 5, so there is real headroom being consumed
#    silently here.
# ---------------------------------------------------------------------------
[Kong - Balancer Retry Storm]
search = `kong_base` \
| stats count as requests, \
        sum(retried) as retried_requests, \
        sum(retries_exhausted) as exhausted_requests, \
        max(try_count) as max_attempts_seen, \
        values(max_retries) as configured_retries, \
        values(upstream_host) as upstream_host \
        by service \
| where requests >= `kong_min_requests` \
| eval retry_pct = round(retried_requests*100/requests, 2) \
| where retry_pct > 5 OR exhausted_requests > 0 \
| sort - exhausted_requests, - retry_pct
description = More than 5% of requests required a balancer retry, OR at least one request exhausted its retries entirely. Kong hides an unhealthy target by retrying against another, so users still see 200s and the error rate stays flat - until the retries run out. exhausted_requests > 0 means that already happened and the failure reached the user; treat any non-zero value as more urgent than the percentage. configured_retries is read per-service from service.retries, not assumed.
cron_schedule = 5-59/10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][MEDIUM] Balancer retry storm - an upstream target is failing
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 7. Upstream target dropped from rotation
#    A pod leaving the pool is invisible while the survivors absorb the load.
#    It becomes visible at the worst possible moment - when the next one goes.
# ---------------------------------------------------------------------------
[Kong - Upstream Target Dropped From Rotation]
search = `kong_proxied` \
| where isnotnull(upstream_ip) \
| stats dc(upstream_ip) as current_targets, values(upstream_ip) as current_list by service \
| append [ search `kong_proxied` earliest=-25h@h latest=-1h@h \
           | where isnotnull(upstream_ip) \
           | stats dc(upstream_ip) as baseline_targets, values(upstream_ip) as baseline_list by service ] \
| stats max(current_targets) as current_targets, values(current_list) as current_list, \
        max(baseline_targets) as baseline_targets, values(baseline_list) as baseline_list \
        by service \
| fillnull value=0 current_targets \
| where baseline_targets > 0 AND current_targets < baseline_targets \
| eval missing_count = baseline_targets - current_targets \
| sort - missing_count
description = Fewer distinct upstream targets are serving traffic than during the preceding 24-hour baseline. Compare current_list against baseline_list to identify which pod left. Expected during a deliberate scale-down or rolling deploy - suppress or disable during planned changes.
cron_schedule = 7,22,37,52 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 60m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][MEDIUM] Upstream target left the pool
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 8. Approaching upstream read timeout
#    The leading indicator for 504s. read_timeout is 60000 ms on the Kong
#    service config; this fires at 80% of it, while requests are still
#    succeeding, which is the only useful time to know.
# ---------------------------------------------------------------------------
[Kong - Approaching Upstream Read Timeout]
search = `kong_proxied` \
| eval near_timeout = if(isnotnull(read_timeout_ms) AND proxy_ms >= (read_timeout_ms * 0.8), 1, 0) \
| stats count as requests, \
        sum(near_timeout) as near_timeout_requests, \
        max(proxy_ms) as slowest_ms, \
        values(read_timeout_ms) as configured_timeout_ms, \
        values(upstream_path) as paths \
        by service, route \
| where near_timeout_requests > 0 \
| eval slowest_ms = round(slowest_ms, 0) \
| sort - slowest_ms
description = Requests are taking more than 80% of THAT SERVICE'S configured read_timeout, read per-event from service.read_timeout rather than assumed. configured_timeout_ms shows the value used. These requests have not failed yet, but they are one small regression away from becoming 504s.
cron_schedule = 8-59/10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][MEDIUM] Requests approaching the 60s upstream read timeout
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 9. Rate limit rejections spike
#    Detects Kong-enforced throttling structurally (429 + short-circuited),
#    NOT via x-ratelimit-* headers. Those headers come from Vault, not Kong.
#    See log-format-validation.md finding 5.
# ---------------------------------------------------------------------------
[Kong - Rate Limit Rejections Spike]
search = `kong_base` \
| where status==429 \
| eval enforced_by = if(short_circuited==1, "kong-plugin", "upstream-passthrough") \
| stats count as throttled, \
        dc(client_ip) as distinct_clients, \
        values(enforced_by) as enforced_by, \
        values(upstream_path) as paths \
        by service, route \
| where throttled >= 20 \
| sort - throttled
description = A burst of 429s. enforced_by distinguishes Kong's rate-limiting plugin (short-circuited before the upstream) from a 429 the upstream returned itself. The plugin is configured on ee-smp-functests; a kong-plugin 429 on any other route means the plugin scope is wider than documented.
cron_schedule = 9-59/10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 2
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 60m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][LOW] Rate limit rejection spike
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 10. Authentication failure spike (auth-route)
#     Vault login and token renewal failures. Either a broken client or
#     credential stuffing - both need eyes.
# ---------------------------------------------------------------------------
[Kong - Authentication Failure Spike]
search = `kong_base` | `kong_auth_route` \
| where status==401 OR status==403 \
| eval auth_op = case(match(upstream_path, "/auth/kubernetes/login$"), "k8s-login", \
                      match(upstream_path, "/auth/token/renew-self$"), "token-renew", \
                      true(), "other") \
| stats count as denials, \
        dc(client_ip) as distinct_clients, \
        values(status) as status_codes, \
        values(auth_op) as operations, \
        values(vault_ns) as namespaces \
        by route \
| where denials >= 25 \
| sort - denials
description = Elevated 401/403 on auth-route. A single client generating most denials is usually a misconfigured workload with a stale service-account token. Many distinct clients failing at once points at a Vault-side auth backend or Kubernetes issuer problem. Cross-check distinct_clients before escalating as a security event.
cron_schedule = 6-59/10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][HIGH] Authentication failure spike on auth-route
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 11. Admin API unexpected activity
#     admin-route exposes Kong's control plane through the data plane. Anyone
#     reaching it can rewrite routing. Treat every caller as privileged.
#
#     TO REDUCE NOISE: add an allowlist of known-good callers by uncommenting
#     and editing the NOT clause below with your CI/CD and operator IPs.
# ---------------------------------------------------------------------------
[Kong - Admin API Unexpected Activity]
search = `kong_base` | `kong_admin_service` \
| stats count as requests, \
        sum(eval(if(status>=400,1,0))) as errors, \
        sum(eval(if(status==401 OR status==403,1,0))) as auth_denied, \
        values(status) as status_codes, \
        values(upstream_path) as paths_touched, \
        min(_time) as first_seen \
        by client_ip \
| eval first_seen = strftime(first_seen, "%F %T") \
| where auth_denied > 0 OR errors >= 5 \
| sort - auth_denied, - errors
description = A caller reaching the Kong Admin API through admin-route was denied, or generated repeated errors. Any 401/403 here is a failed attempt to reach the control plane and should be attributed to a known workload before being dismissed. To allowlist known callers, add a NOT clause on client_ip to the search.
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][CRITICAL] Admin API - denied or erroring caller
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ---------------------------------------------------------------------------
# 12. Log ingestion stalled
#     Monitors the monitor. Without this, a broken log pipeline looks exactly
#     like a perfectly healthy gateway: no errors, no latency, no alerts.
#
#     `stats count` with no BY clause always emits exactly one row, including
#     when the search matched nothing. That is what makes "zero events" a
#     detectable condition rather than an empty result set.
# ---------------------------------------------------------------------------
[Kong - Log Ingestion Stalled]
search = `kong_index` \
| stats count as events \
| where events == 0 \
| eval alert_detail = "No Kong proxy log-serializer events in index=kong_common for the last 10 minutes. Either the gateway is receiving no traffic at all, or the log pipeline from OpenShift stdout to Splunk has broken. Every other Kong alert is blind until this is resolved."
description = No Kong events reached Splunk in the last 10 minutes. This alert exists so that a broken ingestion pipeline does not present as a healthy gateway. If Kong genuinely has quiet periods (overnight, weekends), widen the window or schedule this alert only during business hours rather than lowering its severity.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 60m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][HIGH] Log ingestion stalled - Kong monitoring is blind
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table


# ===========================================================================
# TOPOLOGY MAINTENANCE
#
# The two searches below are not health alerts. The first keeps the dashboard
# dropdowns populated; the second reports when Kong's configuration changes.
# ===========================================================================

# ---------------------------------------------------------------------------
# Kong - Refresh Topology
#
# THIS IS THE ONLY SEARCH THAT WRITES TO THE kong_topology KV STORE COLLECTION.
#
# It exists so the dashboards can populate their Service and Route dropdowns
# from a collection read instead of an index scan. Populating a dropdown with
# a live kong_base search costs a full scan over the selected time range on
# every page load, and it silently drops any route that had no traffic in that
# window - which is exactly the route someone would be looking for.
#
# SECURITY NOTE - READ BEFORE EDITING THIS SEARCH.
# The `stats ... by service, route` below is a security control, not just an
# aggregation. It is what guarantees that only service names, route names, a
# count and a timestamp can reach the collection. Client IPs, Vault
# namespaces, request paths, response headers and token index values cannot,
# regardless of what appears in the logs. Add a field to that BY clause and
# you have widened what gets persisted. See collections.conf.
#
# The append+re-stats merges the last 70 minutes into what is already stored,
# so a route silent for hours stays in the dropdown. The relative_time filter
# ages out anything unseen for 30 days, which bounds the collection.
#
# SHIPS ENABLED, unlike the alerts - it has no threshold to tune, and the
# dropdowns are empty until it first runs. Run it once by hand at install.
#
# OWNERSHIP: reassign this to a service account before handover. Owned by a
# person, it stops running when that person is deprovisioned, and the topology
# silently freezes with no error anywhere.
# ---------------------------------------------------------------------------
[Kong - Refresh Topology]
search = `kong_base` earliest=-70m latest=now \
| stats count as requests, max(_time) as last_seen by service, route \
| append [| inputlookup kong_topology ] \
| stats sum(requests) as requests, max(last_seen) as last_seen by service, route \
| where last_seen > relative_time(now(), "-30d") \
| eval _key = service . "::" . route \
| table _key, service, route, requests, last_seen \
| outputlookup kong_topology
description = Maintains the kong_topology KV Store collection that backs every dashboard's Service and Route dropdown. Merges the last 70 minutes into the stored set so silent routes remain selectable, and ages out anything unseen for 30 days. Only service and route names, a count and a timestamp are stored - see collections.conf before changing the stats clause.
cron_schedule = 12 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = now
enableSched = 1
disabled = 0
alert_type = always
alert.track = 0
counttype = always
action.email = 0


# ---------------------------------------------------------------------------
# Kong - New Route Or Service Detected
#
# Now that the collection knows the established topology, an entity appearing
# in live traffic that is not yet in it means Kong's configuration changed.
# That is worth knowing about on its own, and it is worth knowing about
# urgently if the new route reaches a privileged service.
#
# Expect this on any deliberate Kong config deployment. Suppress during
# planned changes rather than disabling it.
# ---------------------------------------------------------------------------
[Kong - New Route Or Service Detected]
search = `kong_base` \
| stats count as requests, values(upstream_path) as sample_paths by service, route \
| append [| inputlookup kong_topology | eval known=1 | table service, route, known ] \
| stats sum(requests) as requests, values(sample_paths) as sample_paths, max(known) as known by service, route \
| where isnull(known) AND requests > 0 \
| sort - requests
description = A service or route is receiving traffic but is not in the kong_topology collection, meaning it appeared since the last topology refresh. Usually a Kong config deployment. Investigate promptly if the new route fronts a privileged service - an unexpected route to the Admin API is a control-plane exposure.
cron_schedule = 27 * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
enableSched = 1
disabled = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 120m
counttype = number of events
relation = greater than
quantity = 0
action.email = 1
action.email.to = CHANGEME@example.com
action.email.subject = [Kong][MEDIUM] New route or service seen - Kong config changed
action.email.include.results_link = 1
action.email.sendresults = 1
action.email.inline = 1
action.email.format = table
